{% extends 'base.html' %}

{% block title %}Register{% endblock %}

{% block content %}

<div class="container mt-4">
    <div class="card">
        <div class="card-body">
            <h2 class="card-title">Register</h2>

            <form method="post" action="{% url 'register_student' %}">
                {% csrf_token %}
                
                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="{{ form.Username.id_for_label }}">Username:</label>
                            {{ form.Username }}
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="{{ form.Password.id_for_label }}">Password:</label>
                            {{ form.Password }}
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="{{ form.Email.id_for_label }}">Email:</label>
                            {{ form.Email }}
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="{{ form.DegreeProgramID.id_for_label }}">Degree Program:</label>
                            {{ form.DegreeProgramID }}
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary">Register</button>
            </form>

            <p class="mt-3">Already have an account? <a href="{% url 'student_login' %}">Login</a></p>
        </div>
    </div>
</div>

{% endblock %}
