<!-- dashboard.html -->
{% extends 'base.html' %}

{% block title %}Dashboard{% endblock %}

{% block content %}

<div class="container mt-4">
    <h2>Welcome, {{ student.Username }}!</h2>
    <h3>Your Courses:</h3>

    <div class="row">
        {% for course in courses %}
            <div class="col-md-4 mb-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">{{ course.CourseName }}</h5>
                        <p class="card-text">Course ID: {{ course.CourseID }}</p>
                        <a href="{% url 'course_details' course_id=course.CourseID %}" class="btn btn-primary">View Details</a>
                    </div>
                </div>
            </div>
        {% endfor %}
    </div>
</div>

{% endblock %}
